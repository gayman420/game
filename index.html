// the sign left behind in the house once Harris has been kidnapped, standing
// roughly where he used to be
function drawKidnapSign(centerX, refWidth) {
  const gY = groundY();
  const gx = centerX - cameraX + refWidth / 2;
  const postW = 10, postH = 60;
  const boardW = 260, boardH = 130;
  const boardBottom = gY - postH;
  const boardTop = boardBottom - boardH;

  // post holding the sign up
  ctx.fillStyle = '#6b4a2b';
  ctx.fillRect(gx - postW / 2, boardBottom, postW, postH);

  // weathered wooden board, propped up
  ctx.save();
  ctx.translate(gx, (boardTop + boardBottom) / 2);
  ctx.rotate(-0.03);
  ctx.fillStyle = '#8a6339';
  ctx.fillRect(-boardW / 2, -boardH / 2, boardW, boardH);
  ctx.strokeStyle = '#4a331c';
  ctx.lineWidth = 5;
  ctx.strokeRect(-boardW / 2, -boardH / 2, boardW, boardH);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  for (let ly = -boardH / 2 + 18; ly < boardH / 2; ly += 20) {
    ctx.beginPath();
    ctx.moveTo(-boardW / 2 + 8, ly);
    ctx.lineTo(boardW / 2 - 8, ly);
    ctx.stroke();
  }

  ctx.fillStyle = '#221a12';
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px "Segoe UI", Arial, sans-serif';
  const lines = ["I've kidnapped Haris,", 'if you want him back,', 'come to the left,', "dont be late"];
  lines.forEach((line, i) => {
    ctx.fillText(line, 0, -boardH / 2 + 30 + i * 24);
  });
  ctx.restore();
}

// ---------- The shrine (secret room) ----------
function drawCandle(x) {
  const gY = groundY();
  const gx = x - cameraX;

  // soft glow behind everything
  const glow = ctx.createRadialGradient(gx + 6, gY - 40, 2, gx + 6, gY - 40, 42);
  glow.addColorStop(0, 'rgba(255,190,110,0.4)');
  glow.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(gx + 6, gY - 40, 42, 0, Math.PI * 2);
  ctx.fill();

  // wax candlestick
  ctx.fillStyle = '#f2e8d0';
  ctx.fillRect(gx, gY - 34, 12, 34);
  ctx.fillStyle = '#d9cba8';
  ctx.fillRect(gx, gY - 34, 12, 5);

  // flickering flame
  const flick = 1 + Math.sin(Date.now() / 140 + x) * 0.18;
  ctx.save();
  ctx.translate(gx + 6, gY - 34);
  ctx.scale(flick, flick);
  ctx.fillStyle = '#ff9d3f';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-6, -13, 0, -22);
  ctx.quadraticCurveTo(6, -13, 0, 0);
  ctx.fill();
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.moveTo(0, -2);
  ctx.quadraticCurveTo(-3, -9, 0, -15);
  ctx.quadraticCurveTo(3, -9, 0, -2);
  ctx.fill();
  ctx.restore();
}

function drawFramedPicture(centerX, bottomY, w, h, spriteEntry, frameColor) {
  const gx = centerX - cameraX - w / 2;
  const gy = bottomY - h;
  const frameWidth = 10;

  // frame + a little backing shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(gx - frameWidth - 3, gy - frameWidth - 3, w + frameWidth * 2 + 6, h + frameWidth * 2 + 6);
  ctx.fillStyle = frameColor;
  ctx.fillRect(gx - frameWidth, gy - frameWidth, w + frameWidth * 2, h + frameWidth * 2);
  ctx.strokeStyle = '#f4d35e';
  ctx.lineWidth = 2;
  ctx.strokeRect(gx - frameWidth + 3, gy - frameWidth + 3, w + frameWidth * 2 - 6, h + frameWidth * 2 - 6);

  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    ctx.drawImage(spriteEntry.img, t.sx, t.sy, t.sw, t.sh, gx, gy, w, h);
  } else {
    ctx.fillStyle = '#161016';
    ctx.fillRect(gx, gy, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('(missing image)', gx + w / 2, gy + h / 2);
  }
}

function drawAltarCloth(centerX, width) {
  const gY = groundY();
  const gx = centerX - cameraX - width / 2;
  ctx.fillStyle = '#7a1f2b';
  ctx.fillRect(gx, gY - 34, width, 34);
  ctx.fillStyle = '#5c1620';
  ctx.fillRect(gx, gY - 34, width, 6);
  ctx.strokeStyle = '#f4d35e';
  ctx.lineWidth = 2;
  ctx.strokeRect(gx, gY - 34, width, 34);
  // tassel trim
  ctx.fillStyle = '#f4d35e';
  for (let x = gx + 6; x < gx + width - 4; x += 14) {
    ctx.beginPath();
    ctx.arc(x, gY, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawShrineTitle(centerX, y) {
  const gx = centerX - cameraX;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 58px "Segoe UI", Arial, sans-serif';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#3a1015';
  ctx.lineWidth = 8;
  ctx.strokeText('I \u2764 MAHAM', gx, y);
  ctx.fillStyle = '#f4d35e';
  ctx.fillText('I \u2764 MAHAM', gx, y);
  ctx.restore();
}

function drawJailCharacter(centerX, bottomY, w, h, spriteEntry) {
  const gx = centerX - cameraX;
  const gy = bottomY - h;
  ctx.save();
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    ctx.drawImage(spriteEntry.img, t.sx, t.sy, t.sw, t.sh, gx - w / 2, gy, w, h);
  } else {
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(gx - w / 2, gy, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('(missing image)', gx, gy + h / 2);
  }
  ctx.restore();
}

function drawJailCell(centerX, width) {
  const gY = groundY();
  const cellHeight = 230;
  const top = gY - cellHeight;
  const gx = centerX - cameraX - width / 2;

  // back wall of the cell, a shade darker than the room so it reads as recessed
  ctx.fillStyle = '#120c10';
  ctx.fillRect(gx, top, width, cellHeight);

  // grimy floor strip
  ctx.fillStyle = '#1c1418';
  ctx.fillRect(gx, gY - 14, width, 14);

  // the captive(s) standing inside — char.png clears out once Harris has
  // been kidnapped, leaving just the other one behind
  const charW = 78, charH = 138;
  if (!harrisKidnapped) {
    drawJailCharacter(centerX - width / 5, gY - 14, charW, charH, char1Sprite);
  }
  drawJailCharacter(centerX + width / 5, gY - 14, charW, charH, char2Sprite);

  // side posts
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(gx - 8, top - 10, 8, cellHeight + 10);
  ctx.fillRect(gx + width, top - 10, 8, cellHeight + 10);
  // top beam
  ctx.fillRect(gx - 8, top - 16, width + 16, 12);

  // vertical bars, drawn last so the captives read as caged
  const barSpacing = 26;
  ctx.fillStyle = '#242424';
  for (let x = gx + 10; x < gx + width - 5; x += barSpacing) {
    // subtle glossy highlight down the middle of each bar
    ctx.fillStyle = '#242424';
    ctx.fillRect(x, top - 4, 7, cellHeight + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x + 2, top - 4, 2, cellHeight + 4);
  }
}

function drawShrine() {
  const centerX = getRoomWorldWidth() / 2; // dead center of the room
  const gY = groundY();

  const mainW = 280, mainH = 260;
  const sideW = 110, sideH = 140;
  const gap = 24;

  const mainBottom = gY - 34;
  const mainTop = mainBottom - mainH;
  const sideCenterOffset = mainW / 2 + gap + sideW / 2;

  drawAltarCloth(centerX, mainW + 60);

  // smaller pictures flanking the big one
  drawFramedPicture(centerX - sideCenterOffset, gY - 24, sideW, sideH, pic1Sprite, '#3a2414');
  drawFramedPicture(centerX + sideCenterOffset, gY - 24, sideW, sideH, pic2Sprite, '#3a2414');

  // the huge centerpiece, a little wider than before
  drawFramedPicture(centerX, mainBottom, mainW, mainH, mainPicSprite, '#3a2414');

  // title tucked in just above the pictures instead of pinned to the ceiling
  drawShrineTitle(centerX, Math.max(70, mainTop - 22));

  // candles out front on the altar, drawn last so nothing paints over them
  [-140, -85, -30, 30, 85, 140].forEach(dx => drawCandle(centerX + dx));

  // jail cell off to the right side of the room
  const roomWidth = getRoomWorldWidth();
  const cellWidth = Math.min(240, roomWidth * 0.28);
  const cellCenterX = roomWidth - cellWidth / 2 - 40;
  drawJailCell(cellCenterX, cellWidth);
}

function drawStaticCharacter(x, width, height, facing, spriteEntry) {
  const gx = x - cameraX;
  const gY = groundY();
  ctx.save();
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    // fit the sprite within the footprint box while keeping its natural
    // aspect ratio, so it doesn't look squashed/stretched — feet stay
    // planted on the ground either way
    const fitScale = Math.min(width / t.sw, height / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.translate(gx + width / 2, gY - drawH / 2);
    if (facing === -1) ctx.scale(-1, 1);
    ctx.drawImage(
      spriteEntry.img,
      t.sx, t.sy, t.sw, t.sh,
      -drawW / 2, -drawH / 2, drawW, drawH
    );
  } else {
    const gy = gY - height;
    ctx.fillStyle = '#4a6fa5';
    ctx.fillRect(gx, gy, width, height);
    ctx.fillStyle = '#fff';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('(missing image)', gx + width / 2, gy + height / 2);
  }
  ctx.restore();
}

// a defeated enemy (3 hits) collapses and lies flat on the ground for good
function drawCollapsedCharacter(x, width, height, facing, spriteEntry) {
  const gx = x - cameraX;
  const gY = groundY();
  ctx.save();
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    const fitScale = Math.min(width / t.sw, height / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    // rotate onto its side so it reads as "down", feet toward however it was facing
    ctx.translate(gx + width / 2, gY - drawW / 2);
    ctx.rotate(facing === -1 ? -Math.PI / 2 : Math.PI / 2);
    ctx.drawImage(
      spriteEntry.img,
      t.sx, t.sy, t.sw, t.sh,
      -drawW / 2, -drawH / 2, drawW, drawH
    );
  } else {
    ctx.translate(gx + width / 2, gY - height / 4);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#4a6fa5';
    ctx.fillRect(-height / 2, -width / 2, height, width);
  }
  ctx.restore();
}

// the letter falls, lands, then bobs gently once it's hovering
function drawLetter() {
  const drawY = letter.y + (letter.state === 'hovering' ? Math.sin(letter.bobTimer) * 7 : 0);
  const gx = letter.x - cameraX;
  const cx = gx + letter.width / 2;
  const cy = drawY + letter.height / 2;

  // a soft pink aura around the letter, so it reads as something a little
  // magical rather than just a dropped item
  const auraR = letter.width * 1.6;
  const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, auraR);
  aura.addColorStop(0, 'rgba(255,143,179,0.45)');
  aura.addColorStop(0.5, 'rgba(255,143,179,0.22)');
  aura.addColorStop(1, 'rgba(255,143,179,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(cx, cy, auraR, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  if (letterSprite.loaded) {
    const t = letterSprite.trim;
    const fitScale = Math.min(letter.width / t.sw, letter.height / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.drawImage(
      letterSprite.img,
      t.sx, t.sy, t.sw, t.sh,
      gx + letter.width / 2 - drawW / 2, drawY + letter.height / 2 - drawH / 2, drawW, drawH
    );
  } else {
    ctx.fillStyle = '#f4d35e';
    ctx.fillRect(gx, drawY, letter.width, letter.height);
    ctx.strokeStyle = '#c9a227';
    ctx.lineWidth = 2;
    ctx.strokeRect(gx, drawY, letter.width, letter.height);
  }
  ctx.restore();
}

// picks the right sprite/pose for an enemy based on its current state:
// collapsed (3 hits, down for good), hurt-flash (just got hit), or normal
function drawEnemy(en, normalSprite, hurtSprite) {
  if (en.defeated) {
    drawCollapsedCharacter(en.x, en.width, en.height, en.facing, hurtSprite);
  } else {
    drawStaticCharacter(en.x, en.width, en.height, en.facing, en.hurtTimer > 0 ? hurtSprite : normalSprite);
  }
}

function drawMountain(p) {
  const gY = groundY();
  const topY = platformTopY(p);
  const gx = p.x - cameraX;
  const baseExtra = 45;

  // rocky body
  const grad = ctx.createLinearGradient(0, topY, 0, gY);
  grad.addColorStop(0, '#9c8b7a');
  grad.addColorStop(1, '#6b5c4d');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(gx - baseExtra, gY);
  ctx.lineTo(gx, topY);
  ctx.lineTo(gx + p.width, topY);
  ctx.lineTo(gx + p.width + baseExtra, gY);
  ctx.closePath();
  ctx.fill();

  // grassy walkable ledge on top
  ctx.fillStyle = '#5a9c4a';
  ctx.fillRect(gx, topY, p.width, 10);
  ctx.fillStyle = '#457a38';
  ctx.fillRect(gx, topY + 8, p.width, 4);

  // rock texture streaks
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    const sx = gx - baseExtra * 0.6 + i * (p.width / 2.2);
    ctx.beginPath();
    ctx.moveTo(sx, gY - 6);
    ctx.lineTo(sx + 25, topY + 20);
    ctx.stroke();
  }
}

// a little heart, used by drawKissEffect below
function drawHeart(x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.fillStyle = '#ff5c7a';
  ctx.beginPath();
  ctx.moveTo(x, y + size * 0.3);
  ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
  ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size, x, y + size * 1.2);
  ctx.bezierCurveTo(x, y + size, x + size, y + size * 0.7, x + size, y + size * 0.3);
  ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// hearts drifting up around Maham & Harris, plus a "*Kiss*" flourish that
// fades in and back out over the middle stretch of the effect
function drawKissEffect() {
  const t = 1 - (kissEffectTimer / KISS_EFFECT_DURATION); // 0 -> 1 over its lifetime
  const cx = player.x - cameraX + player.width / 2;
  const cy = player.y;

  const heartCount = 6;
  for (let i = 0; i < heartCount; i++) {
    const phase = (t * 1.6 + i / heartCount) % 1;
    const hx = cx + Math.sin(phase * 6.28 + i) * 26;
    const hy = cy - phase * 90;
    drawHeart(hx, hy, 10 + (i % 3) * 3, 1 - phase);
  }

  if (t > 0.12 && t < 0.88) {
    const fadeIn = Math.min(1, (t - 0.12) / 0.15);
    const fadeOut = Math.min(1, (0.88 - t) / 0.15);
    ctx.save();
    ctx.globalAlpha = Math.min(fadeIn, fadeOut);
    ctx.fillStyle = '#ff6f91';
    ctx.font = 'italic bold 26px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('*Kiss*', cx, cy - 60);
    ctx.restore();
  }
}

// a captive hangs upside down by the ankles from a rope tied to the pole
function drawHangingCaptive(poleCenterX, poleTopY, width, height, spriteEntry) {
  const gx = poleCenterX - cameraX;
  const ropeLength = 42;
  const ropeBottomY = poleTopY + ropeLength;

  // rope
  ctx.strokeStyle = '#8a6a3f';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(gx, poleTopY);
  ctx.lineTo(gx, ropeBottomY);
  ctx.stroke();

  ctx.save();
  ctx.translate(gx, ropeBottomY + height / 2);
  ctx.rotate(Math.PI); // upside down — feet (now at top) tied to the rope
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    const fitScale = Math.min(width / t.sw, height / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.drawImage(spriteEntry.img, t.sx, t.sy, t.sw, t.sh, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    ctx.fillStyle = '#4a6fa5';
    ctx.fillRect(-width / 2, -height / 2, width, height);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('(missing image)', 0, 0);
  }
  ctx.restore();
}

// Bakugo once he's been defeated — falls over on the ground and stays
// tinted red, instead of just standing there
function drawDefeatedBoss(x, width, height, facing, spriteEntry, surfaceTopY) {
  const gx = x - cameraX;
  ctx.save();
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    const fitScale = Math.min(width / t.sw, height / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    // lie him down on his side, feet toward however he was last facing
    ctx.translate(gx + width / 2, surfaceTopY - drawW / 2);
    ctx.rotate(facing === -1 ? -Math.PI / 2 : Math.PI / 2);
    ctx.drawImage(
      spriteEntry.img,
      t.sx, t.sy, t.sw, t.sh,
      -drawW / 2, -drawH / 2, drawW, drawH
    );
    // tint the sprite itself (not a box around it) permanently red
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(200,30,30,0.65)';
    ctx.fillRect(-drawW / 2, -drawH / 2, drawW, drawH);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    ctx.translate(gx + width / 2, surfaceTopY - height / 4);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-height / 2, -width / 2, height, width);
  }
  ctx.restore();
}

function drawCaptiveScene() {
  const gx = CAPTIVES_X - cameraX;
  const platformTop = platformTopY(CAPTIVE_PLATFORM); // == groundY(), the rig sits right on the ground
  const postHeight = 180;
  const poleY = platformTop - postHeight;
  const poleHalfSpan = 60;

  // two support posts driven straight into the ground
  ctx.fillStyle = '#5c4027';
  ctx.fillRect(gx - poleHalfSpan - 8, poleY, 14, postHeight);
  ctx.fillRect(gx + poleHalfSpan - 6, poleY, 14, postHeight);
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(gx - poleHalfSpan - 10, platformTop - 12, 18, 12);
  ctx.fillRect(gx + poleHalfSpan - 8, platformTop - 12, 18, 12);

  // the horizontal pole itself
  ctx.fillStyle = '#6b4a2b';
  ctx.fillRect(gx - poleHalfSpan - 10, poleY - 9, poleHalfSpan * 2 + 20, 18);
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2;
  ctx.strokeRect(gx - poleHalfSpan - 10, poleY - 9, poleHalfSpan * 2 + 20, 18);

  // Harris, tied up and hanging upside down by the ankles
  drawHangingCaptive(CAPTIVES_X, poleY, 90, 130, harrisSprite);

  // char.png — the one holding him captive, NOT tied up — stands guard on
  // the ground facing Harris, until the walk-off cutscene takes him away
  if (!bakugoGone) {
    if (bossDefeated) {
      drawDefeatedBoss(bakugoX, 90, 120, -1, char1Sprite, platformTop);
    } else {
      const bakugoSurfaceY = platformTop - bossJumpLift;
      drawStandingOnPlatform(bakugoX, 90, 120, -1, char1Sprite, bakugoSurfaceY, bossHurtTimer > 0);
    }
  }
}

// small burst of light used for Bakugo's takeoff puff when he dashes or hovers
function drawExplosionBurst(gx, gy, radius, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius);
  grad.addColorStop(0, '#fff3b0');
  grad.addColorStop(0.5, '#f4a259');
  grad.addColorStop(1, 'rgba(230,57,70,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(gx, gy, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// the little puff under Bakugo's feet when he hops to dodge
function drawBossDodgePuff() {
  if (bossDodgePuffTimer <= 0) return;
  const platformTop = platformTopY(CAPTIVE_PLATFORM);
  const gx = bossDodgePuffX - cameraX + 45;
  const progress = 1 - (bossDodgePuffTimer / 16);
  const radius = 14 + progress * 26;
  const alpha = 1 - progress;
  drawExplosionBurst(gx, platformTop - 6, radius, alpha);
}

// Maham's attack slash landing on Bakugo during the boss fight — he stands
// on the elevated platform, not the ground, so this doesn't reuse the
// junkyard drawSlashes() positioning
function drawBossSlash() {
  if (bossSlashTimer <= 0) return;
  const platformTop = platformTopY(CAPTIVE_PLATFORM) - bossJumpLift;
  const bossWidth = 90, bossHeight = 120;
  const gx = bakugoX - cameraX;
  const cx = gx + bossWidth / 2;
  const cy = platformTop - bossHeight / 2;
  const size = Math.max(bossWidth, bossHeight) * 1.15;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(-1, 1);
  if (slashSprite.loaded) {
    const t = slashSprite.trim;
    const fitScale = Math.min(size / t.sw, size / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.drawImage(slashSprite.img, t.sx, t.sy, t.sw, t.sh, -drawW / 2, -drawH / 2, drawW, drawH);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(-size / 2, -size / 2, size, size);
  }
  ctx.restore();
}

// Shown briefly after Maham fails to block enough of Bakugo's explosions and
// gets reset back to the start of this attempt at the fight
function drawBossRespawnMessage() {
  const alpha = Math.min(1, bossRespawnMsgTimer / 20);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 5;
  ctx.strokeText('Try again!', canvas.width / 2, 110);
  ctx.fillText('Try again!', canvas.width / 2, 110);
  ctx.restore();
}

// Shown briefly above Bakugo when he parries one of Maham's hits outright
function drawBossParryMessage() {
  const alpha = Math.min(1, bossParryMsgTimer / 15);
  const platformTop = platformTopY(CAPTIVE_PLATFORM) - bossJumpLift;
  const gx = bakugoX - cameraX + 45;
  const gy = platformTop - 140;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#4ea8de';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 4;
  ctx.strokeText('Blocked!', gx, gy);
  ctx.fillText('Blocked!', gx, gy);
  ctx.restore();
}

// Bakugo's big explosion attack — uses explosion.gif, and can be blocked by
// pressing R during the windup (see blockPromptActive / blockSuccess)
function drawBigExplosion() {
  const px = player.x - cameraX + player.width / 2;
  const py = player.y + player.height / 2;
  const size = blockSuccess ? 140 : 260;

  ctx.save();
  if (explosionSprite.loaded) {
    const iw = explosionSprite.img.naturalWidth;
    const ih = explosionSprite.img.naturalHeight;
    const fitScale = Math.min(size / iw, size / ih);
    const drawW = iw * fitScale;
    const drawH = ih * fitScale;
    if (blockSuccess) ctx.globalAlpha = 0.6;
    ctx.drawImage(explosionSprite.img, 0, 0, iw, ih, px - drawW / 2, py - drawH / 2, drawW, drawH);
  } else {
    ctx.fillStyle = blockSuccess ? 'rgba(244,162,89,0.5)' : 'rgba(230,57,70,0.75)';
    ctx.beginPath();
    ctx.arc(px, py, size / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  if (blockSuccess) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BLOCKED!', px, py - size / 2 - 12);
  }
  ctx.restore();
}

// draws a standing character on an arbitrary elevated surface (rather than
// on the ground, like drawStaticCharacter does)
function drawStandingOnPlatform(x, width, height, facing, spriteEntry, surfaceTopY, hurt) {
  const gx = x - cameraX;
  ctx.save();
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    const fitScale = Math.min(width / t.sw, height / t.sh);
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.translate(gx + width / 2, surfaceTopY - drawH / 2);
    if (facing === -1) ctx.scale(-1, 1);
    ctx.drawImage(
      spriteEntry.img,
      t.sx, t.sy, t.sw, t.sh,
      -drawW / 2, -drawH / 2, drawW, drawH
    );
    if (hurt) {
      // tint only the pixels of the sprite that were just drawn (not a
      // rectangle around it) by compositing on top of its own alpha
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,40,40,0.55)';
      ctx.fillRect(-drawW / 2, -drawH / 2, drawW, drawH);
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    ctx.fillStyle = hurt ? '#c0392b' : '#4a6fa5';
    ctx.fillRect(gx, surfaceTopY - height, width, height);
  }
  ctx.restore();
}

function currentMahamSprite() {
  if (!player.onGround) return mahamSprites.jump;
  if (attackCooldown > ATTACK_COOLDOWN - ATTACK_ANIM_DURATION) return mahamSprites.attack;
  if (player.vx !== 0) return mahamSprites.walk;
  return mahamSprites.idle;
}

function drawPlayer() {
  if (mahamGone) return;
  const px = player.x - cameraX;
  const py = player.y;
  const spriteEntry = currentMahamSprite();
  ctx.save();
  if (spriteEntry.loaded) {
    const t = spriteEntry.trim;
    const needsFlipInvert = spriteEntry === mahamSprites.walk || spriteEntry === mahamSprites.jump;
    // the walk and jump frames were drawn facing the opposite way from
    // idle/attack, so flip the mirroring logic just for those
    const facingFlip = needsFlipInvert ? -player.facing : player.facing;
    ctx.translate(px + player.width/2, py + player.height/2);
    if (facingFlip === -1) ctx.scale(-1, 1);
    ctx.drawImage(
      spriteEntry.img,
      t.sx, t.sy, t.sw, t.sh,
      -player.width/2, -player.height/2, player.width, player.height
    );
  } else {
    ctx.fillStyle = '#e07a5f';
    ctx.fillRect(px, py, player.width, player.height);
    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('maham.png', px + player.width/2, py + player.height/2);
  }
  ctx.restore();
}

function drawNPC(npc) {
  const nx = npc.x - cameraX;
  const ny = npc.y;
  const spriteEntry = npc.onGround ? npc.sprites.walk : npc.sprites.jump;

  ctx.save();
  if (spriteEntry.loaded) {
    ctx.translate(nx + npc.width/2, ny + npc.height/2);
    if (npc.facing === -1) ctx.scale(-1, 1);
    const t = spriteEntry.trim;
    ctx.drawImage(
      spriteEntry.img,
      t.sx, t.sy, t.sw, t.sh,
      -npc.width/2, -npc.height/2, npc.width, npc.height
    );
  } else {
    ctx.fillStyle = '#c48a3f';
    ctx.fillRect(nx, ny, npc.width, npc.height);
  }
  ctx.restore();
}

function updateNPC(npc, leader, playerJumped) {
  if (npc.following) {
    // stay behind the leader, on whichever side it approached from
    const behindDir = leader.facing >= 0 ? -1 : 1;
    const targetX = leader.x + behindDir * npc.followOffset;
    const dx = targetX - npc.x;

    if (Math.abs(dx) > 4) {
      npc.vx = Math.sign(dx) * npc.speed;
      npc.facing = Math.sign(dx);
    } else {
      npc.vx = 0;
    }

    // hop along whenever the leader jumps, so long as this npc is grounded
    if (playerJumped && npc.onGround) {
      npc.vy = -13;
      npc.onGround = false;
    }
  } else {
    npc.vx = 0;
  }

  npc.x += npc.vx;
  const xBeforeWalls = npc.x;
  resolvePlatformSides(npc);
  const blocked = npc.x !== xBeforeWalls;

  // auto-hop over anything blocking the path (mountains), regardless of
  // whether the leader happened to jump at that exact moment
  if (blocked && npc.onGround && npc.vx !== 0) {
    npc.vy = -15.5;
    npc.onGround = false;
  }

  applyGravityAndCollide(npc);
}

// if a cat ends up too far from its leader (stuck on geometry, fell behind,
// whatever) just pop it back to their side rather than leaving it stranded
const TELEPORT_DISTANCE = 750;
function teleportIfStranded(npc, leader) {
  if (!npc.following) return;
  const dx = Math.abs(leader.x - npc.x);
  if (dx <= TELEPORT_DISTANCE) return;

  const behindDir = leader.facing >= 0 ? -1 : 1;
  npc.x = leader.x + behindDir * npc.followOffset;
  npc.y = groundY() - npc.height;
  npc.vx = 0;
  npc.vy = 0;
  npc.onGround = true;
}

// ---------- Physics / update ----------
function update() {
  if (currentScene === 'forest') updatePetals();

  // ---- Bad ending cutscene: takes over movement/camera entirely ----
  if (badEndingPhase === 'walkingOff') {
    const speed = 6;
    player.x -= speed;
    player.facing = -1;
    bakugoX -= speed;
    // camera stays put so Maham and Bakugo visibly walk off the left edge
    const screenX = player.x - cameraX;
    if (screenX < -150 - player.width) {
      mahamGone = true;
      bakugoGone = true;
      badEndingPhase = 'harrisAlone';
      // hold the camera on Harris now that the other two are gone
      const worldWidth = getWorldWidth();
      const leftBound = getForestLeftBound();
      cameraX = Math.max(leftBound, Math.min(CAPTIVES_X - canvas.width / 2, worldWidth - canvas.width));
      startDialogue(harrisAloneDialogueLines, () => {
        showBadEndingScreen();
      });
    }
    return;
  }
  if (badEndingPhase === 'harrisAlone') {
    // camera holds on Harris; nothing else to update during this cutscene
    return;
  }

  // ---- Good ending cutscene: Maham walks over to Harris, they share a
  // kiss (hearts + "*Kiss*" flourish), then the love-you dialogue plays ----
  if (goodEndingPhase === 'walkingToHarris') {
    const targetX = CAPTIVES_X - player.width / 2; // stand right under Harris
    const dx = targetX - player.x;
    const speed = 4;
    if (Math.abs(dx) <= speed) {
      player.x = targetX;
      player.vx = 0;
      goodEndingPhase = 'kissing';
      kissEffectTimer = KISS_EFFECT_DURATION;
    } else {
      player.facing = dx > 0 ? 1 : -1;
      player.x += Math.sign(dx) * speed;
    }
    const worldWidth = getWorldWidth();
    const leftBound = getForestLeftBound();
    cameraX = Math.max(leftBound, Math.min(player.x - canvas.width / 2 + player.width / 2, worldWidth - canvas.width));
    return;
  }
  if (goodEndingPhase === 'kissing') {
    if (kissEffectTimer > 0) {
      kissEffectTimer -= 1;
      return;
    }
    goodEndingPhase = 'none';
    startDialogue(loveDialogueLines, () => {
      showGoodEndingScreen();
    });
    // fall through — the dialogueActive freeze further down in update()
    // takes over from here, same as any other triggered dialogue
  }

  let playerJumped = false;

  if (dialogueActive || harrisRoomPhase === 'entering' || bossGameOverActive) {
    // freeze maham in place while talking, while Harris bursts in, or while
    // the Game Over screen is up waiting for a click
    player.vx = 0;
  } else {
    // horizontal movement
    if (keys['KeyA']) {
      player.vx = -player.speed;
      player.facing = -1;
    } else if (keys['KeyD']) {
      player.vx = player.speed;
      player.facing = 1;
    } else {
      player.vx = 0;
    }

    // jump
    if (keys['Space'] && player.onGround) {
      player.vy = -player.jumpPower;
      player.onGround = false;
      playerJumped = true;
    }
  }

  // gravity + ground/platform collision
  player.x += player.vx;
  resolvePlatformSides(player);
  applyGravityAndCollide(player);

  // attack cooldown ticks down regardless of scene; holding F keeps
  // attacking automatically at that rate rather than needing repeated taps
  if (attackCooldown > 0) attackCooldown -= 1;

  if (keys['KeyF'] && !dialogueActive && !bossGameOverActive) {
    tryAttack();
  }

  // world bounds — the forest's right edge walks Maham off-screen into the
  // junkyard scene, and the junkyard's left edge walks her back out. the
  // forest's own left edge is normally x = 0, but opens up further left
  // once Harris has been kidnapped (see getForestLeftBound())
  const worldWidth = getWorldWidth();
  const leftBound = currentScene === 'forest' ? getForestLeftBound() : 0;
  if (!dialogueActive && currentScene === 'forest' && player.x + player.width > worldWidth) {
    enterJunkyard();
    return;
  }
  if (!dialogueActive && currentScene === 'junkyard' && player.x < 0) {
    exitJunkyardToForest();
    return;
  }
  if (player.x < leftBound) player.x = leftBound;
  if (player.x + player.width > worldWidth) player.x = worldWidth - player.width;

  // camera follows player, centered-ish
  const targetCameraX = player.x - canvas.width / 2 + player.width / 2;
  cameraX = Math.max(leftBound, Math.min(targetCameraX, worldWidth - canvas.width));

  if (currentScene === 'forest') {
    // ---- Cherry & Jerry: proximity trigger (this is where they're first found) ----
    if (!catsGreeted && !dialogueActive) {
      const midX = (cherry.x + jerry.x) / 2;
      if (Math.abs(player.x - midX) < 110) {
        startDialogue(catDialogueLines, () => {
          catsGreeted = true;
          cherry.following = true;
          jerry.following = true;
        });
      }
    }

    // ---- Harris & captive: triggers once Maham reaches the spot where
    // they're being held, out to the left
    if (!captivesFound && !dialogueActive) {
      if (Math.abs(player.x - CAPTIVES_X) < 160) {
        startDialogue(captiveDialogueLines, () => {
          captivesFound = true;
          showCaptiveChoice();
        });
      }
    }

    // ---- Bakugo boss fight (only runs once "Choose Harris" kicks it off) ----
    if (bossFightActive && !bossDefeated && !dialogueActive && !bossGameOverActive) {
      if (bossHurtTimer > 0) bossHurtTimer -= 1;
      if (bossSlashTimer > 0) bossSlashTimer -= 1;
      if (bossRespawnMsgTimer > 0) bossRespawnMsgTimer -= 1;
      if (bossParryMsgTimer > 0) bossParryMsgTimer -= 1;

      // the little shove Bakugo gets when he's hit — eases back to a stop
      // rather than instantly snapping back into place
      if (bossKnockback !== 0) {
        bakugoX += bossKnockback;
        bossKnockback *= 0.8;
        if (Math.abs(bossKnockback) < 0.5) bossKnockback = 0;
        const platformLeft = CAPTIVE_PLATFORM.x + 40;
        const platformRight = CAPTIVE_PLATFORM.x + CAPTIVE_PLATFORM.width - 90 - 30;
        bakugoX = Math.max(platformLeft, Math.min(platformRight, bakugoX));
      }

      if (bossAttackState === 'idle') {
        // idles by hanging in the air on little explosion puffs instead of
        // standing dead still
        bossHoverPhase += 0.07;
        bossJumpLift = Math.abs(Math.sin(bossHoverPhase)) * BOSS_HOVER_HEIGHT;
        bossHoverPuffTimer -= 1;
        if (bossHoverPuffTimer <= 0) {
          bossHoverPuffTimer = 18 + Math.random() * 14;
          bossDodgePuffTimer = 14;
          bossDodgePuffX = bakugoX;
        }

        bossAttackTimer -= 1;
        if (bossAttackTimer <= 0) {
          const bakugoCenter = bakugoX + 45;
          const playerCenter = player.x + player.width / 2;
          const dist = Math.abs(bakugoCenter - playerCenter);

          if (dist > BOSS_ATTACK_RANGE) {
            // too far away to use an explosion on her — close the gap with an
            // explosion dash first instead of attacking from a distance
            const platformLeft = CAPTIVE_PLATFORM.x + 40;
            const platformRight = CAPTIVE_PLATFORM.x + CAPTIVE_PLATFORM.width - 90 - 30;
            const side = bakugoCenter > playerCenter ? 1 : -1;
            const desired = (playerCenter - 45) + side * (BOSS_ATTACK_RANGE * 0.5);
            bossDodgeStartX = bakugoX;
            bossDodgeTargetX = Math.min(platformRight, Math.max(platformLeft, desired));
            bossAttackState = 'closing';
            bossDodgeStateTimer = BOSS_DODGE_DURATION;
            bossDodgePuffTimer = 18;
            bossDodgePuffX = bakugoX;
          } else {
            bossAttackState = 'bigWindup';
            bossAttackStateTimer = BOSS_BIG_WINDUP_DURATION;
            blockPromptActive = true;
            blockSuccess = false;
            blockPromptEl.style.display = 'block';
          }
        }
      } else if (bossAttackState === 'closing') {
        // hovering across the gap on a burst of explosions to get in range,
        // rather than randomly hopping around the platform
        bossDodgeStateTimer -= 1;
        const t = 1 - (bossDodgeStateTimer / BOSS_DODGE_DURATION);
        bakugoX = bossDodgeStartX + (bossDodgeTargetX - bossDodgeStartX) * t;
        bossJumpLift = Math.sin(Math.min(1, Math.max(0, t)) * Math.PI) * BOSS_DODGE_ARC_HEIGHT;
        if (bossDodgeStateTimer <= 0) {
          bakugoX = bossDodgeTargetX;
          bossJumpLift = 0;
          bossAttackState = 'idle';
          bossAttackTimer = 12 + Math.random() * 18; // re-check almost immediately, now that he's close
        }
      } else if (bossAttackState === 'bigWindup') {
        bossAttackStateTimer -= 1;
        if (bossAttackStateTimer <= 0) {
          blockPromptActive = false;
          blockPromptEl.style.display = 'none';
          bossAttackState = 'bigExplosion';
          bossAttackStateTimer = BOSS_BIG_EXPLOSION_DURATION;
        }
      } else if (bossAttackState === 'bigExplosion') {
        bossAttackStateTimer -= 1;
        if (bossAttackStateTimer <= 0) {
          bossExplosionsThrown += 1;
          if (!blockSuccess) {
            playerHealth -= 1;
            updatePlayerHealthBar();
          }

          if (playerHealth <= 0) {
            triggerBossGameOver();
          } else {
            bossAttackState = 'idle';
            bossAttackTimer = 85 + Math.random() * 45;
          }
        }
      }

      if (bossDodgePuffTimer > 0) bossDodgePuffTimer -= 1;
    }
  }

  if (currentScene === 'junkyard') {
    // ---- Chud 1/2/3: proximity trigger, out in the junkyard ----
    if (!enemiesConfronted && !dialogueActive) {
      if (Math.abs(player.x - enemyClusterX) < 150) {
        startDialogue(chudDialogueLines, () => {
          enemiesConfronted = true;
        });
      }
    }

    if (activeSlashes.length) {
      activeSlashes.forEach(s => { s.timer -= 1; });
      activeSlashes = activeSlashes.filter(s => s.timer > 0);
    }

    if (enemiesConfronted && !dialogueActive) {
      updateEnemyWander(enemy1);
      updateEnemyWander(enemy2);
      updateEnemyWander(enemy3);
    } else {
      // still decay hurt flashes even while frozen for dialogue
      [enemy1, enemy2, enemy3].forEach(en => { if (en.hurtTimer > 0) en.hurtTimer -= 1; });
    }

    // ---- Letter: drops from the last chud, lands, then rises into a hover ----
    if (letter.active && !letter.collected) {
      const landY = letterLandY();
      const hoverY = letterHoverY();

      if (letter.state === 'falling') {
        letter.vy += 0.9; // gravity
        letter.y += letter.vy;
        if (letter.y >= landY) {
          letter.y = landY;
          letter.vy = 0;
          letter.state = 'landed';
          letter.landTimer = 35; // sits on the ground for a beat first
          letter.pickupTimer = 240; // ~4 seconds at 60fps before it can be grabbed
        }
      } else if (letter.state === 'landed') {
        letter.landTimer -= 1;
        if (letter.landTimer <= 0) {
          letter.state = 'rising';
        }
      } else if (letter.state === 'rising') {
        letter.y += (hoverY - letter.y) * 0.08;
        if (Math.abs(letter.y - hoverY) < 0.75) {
          letter.y = hoverY;
          letter.state = 'hovering';
          letter.bobTimer = 0;
        }
      } else if (letter.state === 'hovering') {
        letter.bobTimer += 0.06;
      }

      if (letter.pickupTimer > 0) letter.pickupTimer -= 1;

      // pickup only opens up once she's had a few seconds to actually see it
      if (!dialogueActive && letter.state !== 'falling' && letter.pickupTimer <= 0) {
        const letterRect = { x: letter.x, y: letter.y, width: letter.width, height: letter.height };
        const playerRect = { x: player.x, y: player.y, width: player.width, height: player.height };
        if (rectsOverlap(playerRect, letterRect)) {
          letter.collected = true;
          letter.active = false;
          startDialogue(letterDialogueLines, () => {
            harrisKidnapped = true;
          });
        }
      }
    }
  }

  // ---- Cherry & Jerry: movement/follow AI (active in every scene, so they can follow through doors) ----
  updateNPC(cherry, player, playerJumped);
  updateNPC(jerry, cherry, false); // jerry trails cherry, hops with her own logic below

  // let jerry also hop when maham jumps (feels more like a little parade)
  if (playerJumped && jerry.following && jerry.onGround) {
    jerry.vy = -13;
    jerry.onGround = false;
  }

  // safety net: don't let either cat get permanently stranded
  teleportIfStranded(cherry, player);
  teleportIfStranded(jerry, player);

  if (currentScene === 'house') {
    // ---- Harris: proximity trigger ----
    if (!harrisTalked && !dialogueActive) {
      if (Math.abs(player.x - harris.x) < 90) {
        startDialogue(harrisDialogueLines, () => {
          harrisTalked = true;
        });
      }
    }
  }

  if (currentScene === 'houseRoom') {
    // ---- Harris: bursts in the first time the shrine room is found ----
    if (harrisRoomPhase === 'entering') {
      const targetX = 260;
      harrisRoom.facing = 1;
      if (harrisRoom.x < targetX) {
        harrisRoom.x = Math.min(targetX, harrisRoom.x + harrisRoom.speed);
      }
      if (harrisRoom.x >= targetX && !dialogueActive) {
        startDialogue(harrisRoomDialogueLines, () => {
          harrisRoomEventDone = true;
          harrisRoomPhase = 'leaving';
        });
      }
    } else if (harrisRoomPhase === 'leaving') {
      const targetX = roomExitDoor.x - 40;
      harrisRoom.facing = -1;
      harrisRoom.x = Math.max(targetX, harrisRoom.x - harrisRoom.speed);
      if (harrisRoom.x <= targetX) {
        harrisRoomPhase = null; // he's gone, stop drawing him
      }
    }
  }

  // ---- Doors: figure out if the player is close enough to use one ----
  // (actually switching scenes happens on the E keypress, see the keydown handler)
  nearDoor = null;
  if (!dialogueActive) {
    if (currentScene === 'forest' && forestHouseDoor && doorOverlap(forestHouseDoor)) {
      nearDoor = 'forestHouse';
    } else if (currentScene === 'house' && doorOverlap(houseExitDoor)) {
      nearDoor = 'houseExit';
    } else if (currentScene === 'house' && doorOverlap(houseInnerDoor)) {
      nearDoor = 'houseInner';
    } else if (currentScene === 'houseRoom' && doorOverlap(roomExitDoor)) {
      nearDoor = 'roomExit';
    }
  }
  doorPromptEl.style.display = nearDoor ? 'block' : 'none';
}

// ---------- Render ----------
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (currentScene === 'forest') {
    // sky gradient already via CSS background; sun glow, hills, then clouds
    drawSunGlow();
    drawHillLayer(hillsFar, 0.2, '#bfe0c8');
    drawHillLayer(hillsNear, 0.4, '#a3d2ab');
    clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

    const gY = groundY();
    // far trees (slightly behind) then bushes then ground then player
    trees.forEach(t => drawTree(t.x, gY, t.scale, t.shade, t.type));
    drawGround();
    flowers.forEach(f => drawFlower(f.x, gY, f.scale, f.color));
    bushes.forEach(b => drawBush(b.x, gY, b.scale, b.flowered, b.flowerColor));
    platforms.forEach(p => drawMountain(p));
    drawHouseExterior();
    if (harrisKidnapped) drawCaptiveScene();
    drawNPC(cherry);
    drawNPC(jerry);
    drawPlayer();
    if (goodEndingPhase === 'kissing') drawKissEffect();
    if (bossFightActive || bossSlashTimer > 0) {
      drawBossDodgePuff();
      drawBossSlash();
      if (bossAttackState === 'bigExplosion') drawBigExplosion();
      if (bossRespawnMsgTimer > 0) drawBossRespawnMessage();
      if (bossParryMsgTimer > 0) drawBossParryMessage();
    }
    petals.forEach(p => drawPetal(p));
  } else if (currentScene === 'junkyard') {
    // junkyard.gif fills the whole screen; the chud confrontation happens
    // right on top of it, no scrolling or set dressing needed
    drawJunkyardBackground();
    drawEnemy(enemy1, enemy1Sprite, enemy1HurtSprite);
    drawEnemy(enemy2, enemy2Sprite, enemy2HurtSprite);
    drawEnemy(enemy3, enemy3Sprite, enemy3HurtSprite);
    if (letter.active && !letter.collected) drawLetter();
    drawNPC(cherry);
    drawNPC(jerry);
    drawPlayer();
    drawSlashes();
  } else if (currentScene === 'house') {
    drawIndoorBackground('#e8d9c3', '#a97c50', '#7a5a38');
    drawHouseFurnishings();
    drawDoor(houseExitDoor.x, houseExitDoor.width, houseExitDoor.height);
    drawDoor(houseInnerDoor.x, houseInnerDoor.width, houseInnerDoor.height);
    drawNPC(cherry);
    drawNPC(jerry);
    if (harrisKidnapped) {
      drawKidnapSign(harris.x, harris.width);
    } else {
      drawStaticCharacter(harris.x, harris.width, harris.height, harris.facing, harrisSprite);
    }
    drawPlayer();
  } else if (currentScene === 'houseRoom') {
    drawIndoorBackground('#241a1f', '#180f13', '#5c2a3a');
    drawShrine();
    drawDoor(roomExitDoor.x, roomExitDoor.width, roomExitDoor.height);
    drawNPC(cherry);
    drawNPC(jerry);
    if (harrisRoomPhase) {
      drawStaticCharacter(harrisRoom.x, harrisRoom.width, harrisRoom.height, harrisRoom.facing, harrisSprite);
    }
    drawPlayer();
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
