<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maham's Forest Walk</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a1a0f;
    font-family: 'Segoe UI', Arial, sans-serif;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #gameCanvas {
    display: block;
    background: linear-gradient(180deg, #a3d8ff 0%, #cfe8ff 22%, #ffd9ec 55%, #ffe9cf 78%, #eafff0 100%);
  }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #fff;
    background: rgba(0,0,0,0.35);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    pointer-events: none;
  }
  #imgNote {
    position: fixed;
    bottom: 10px;
    left: 10px;
    color: #fff;
    background: rgba(0,0,0,0.35);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 320px;
    pointer-events: none;
  }
  #dialogueBox {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    width: min(560px, 85vw);
    background: rgba(20, 20, 25, 0.9);
    border: 3px solid #f4d35e;
    border-radius: 12px;
    padding: 16px 20px;
    color: #fff;
    font-size: 18px;
    line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  #dialogueSpeaker {
    font-weight: bold;
    color: #f4d35e;
    margin-bottom: 6px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #dialogueHint {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.65;
    text-align: right;
  }
  #doorPrompt {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: rgba(20, 20, 25, 0.85);
    border: 2px solid #f4d35e;
    border-radius: 8px;
    padding: 8px 16px;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    pointer-events: none;
  }
  #doorPrompt kbd {
    display: inline-block;
    background: #f4d35e;
    color: #2a2a2a;
    border-radius: 4px;
    padding: 1px 7px;
    margin-right: 6px;
    font-family: inherit;
  }
  #choiceBox {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    width: min(560px, 85vw);
    background: rgba(20, 20, 25, 0.9);
    border: 3px solid #f4d35e;
    border-radius: 12px;
    padding: 16px 20px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  #choiceBox .choicePrompt {
    font-weight: bold;
    color: #f4d35e;
    margin-bottom: 12px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #choiceBox .choiceOptions {
    display: flex;
    gap: 12px;
  }
  #choiceBox button {
    flex: 1;
    background: #2a2a2a;
    color: #fff;
    border: 2px solid #f4d35e;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
  }
  #choiceBox button:hover {
    background: #f4d35e;
    color: #2a2a2a;
  }
  #badEndingScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #badEndingTitle {
    color: #b3261e;
    font-size: 64px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 18px rgba(179,38,30,0.7);
  }
  #goodEndingScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #goodEndingTitle {
    color: #ff8fa3;
    font-size: 64px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 22px rgba(255,143,163,0.8);
  }
  #gameOverScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.85);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    cursor: pointer;
  }
  #gameOverTitle {
    color: #e63946;
    font-size: 64px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 18px rgba(230,57,70,0.7);
  }
  #gameOverSubtext {
    color: #fff;
    font-size: 18px;
    margin-top: 18px;
    opacity: 0.8;
  }
  #finalMessageScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    align-items: center;
    justify-content: center;
    z-index: 20;
    cursor: pointer;
  }
  #finalMessageText {
    color: #fff;
    font-size: 28px;
    text-align: center;
    padding: 0 20px;
  }
  #bossHealthBar {
    display: none;
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: min(420px, 80vw);
    z-index: 15;
  }
  #bossHealthName {
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #bossHealthTrack {
    width: 100%;
    height: 22px;
    background: rgba(0,0,0,0.55);
    border: 2px solid #f4d35e;
    border-radius: 6px;
    overflow: hidden;
  }
  #bossHealthFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(#e63946, #b3261e);
    transition: width 0.15s ease-out;
  }
  #playerHealthBar {
    display: none;
    position: fixed;
    bottom: 16px;
    left: 16px;
    width: min(240px, 60vw);
    z-index: 15;
  }
  #playerHealthName {
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #playerHealthTrack {
    width: 100%;
    height: 22px;
    background: rgba(0,0,0,0.55);
    border: 2px solid #f4d35e;
    border-radius: 6px;
    overflow: hidden;
  }
  #playerHealthFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(#8bd17c, #4c9a4c);
    transition: width 0.15s ease-out;
  }
  #blockPrompt {
    display: none;
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 25, 0.9);
    border: 2px solid #f4d35e;
    border-radius: 8px;
    padding: 10px 18px;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    z-index: 16;
  }
  #blockPrompt kbd {
    display: inline-block;
    background: #f4d35e;
    color: #2a2a2a;
    border-radius: 4px;
    padding: 1px 9px;
    margin-right: 8px;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="ui">
  <b>Controls</b><br>
  A / D — move left / right<br>
  SPACE — jump / advance dialogue<br>
  E — enter a door<br>
  F — attack
</div>
<div id="imgNote"></div>

<div id="doorPrompt"><kbd>E</kbd>Enter</div>

<div id="dialogueBox">
  <div id="dialogueSpeaker"></div>
  <div id="dialogueText"></div>
  <div id="dialogueHint">SPACE to continue</div>
</div>

<div id="choiceBox">
  <div class="choicePrompt">What does Maham do?</div>
  <div class="choiceOptions">
    <button id="choiceBakugoBtn">Choose Bakugo</button>
    <button id="choiceHarrisBtn">Choose Harris</button>
  </div>
</div>

<div id="bossHealthBar">
  <div id="bossHealthName">BAKUGO</div>
  <div id="bossHealthTrack"><div id="bossHealthFill"></div></div>
</div>

<div id="playerHealthBar">
  <div id="playerHealthName">MAHAM</div>
  <div id="playerHealthTrack"><div id="playerHealthFill"></div></div>
</div>

<div id="blockPrompt"><kbd>R</kbd>BLOCK!</div>

<div id="badEndingScreen"><div id="badEndingTitle">BAD ENDING</div></div>

<div id="goodEndingScreen"><div id="goodEndingTitle">GOOD ENDING</div></div>

<div id="gameOverScreen">
  <div id="gameOverTitle">GAME OVER</div>
  <div id="gameOverSubtext">Click to try again</div>
</div>

<div id="finalMessageScreen"><div id="finalMessageText"></div></div>

<canvas id="gameCanvas"></canvas></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Keep the canvas width matching the real window width, exactly like the
// original code did (that's what kept the zoom/character-size looking
// right). The only thing that needs fixing is the HEIGHT: on a tall/narrow
// window, using the full window height left way too much empty sky above
// a thin ground strip. So we just cap the height to a sane aspect ratio
// and letterbox top/bottom when the window is taller than that -- width
// (and therefore zoom) is never touched.
const GAME_ASPECT = 16 / 9; // adjust if this still isn't quite the ratio you tested locally

function resize() {
  const w = window.innerWidth;
  const h = Math.min(window.innerHeight, w / GAME_ASPECT);
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
resize();
window.addEventListener('resize', resize);

// ---------- Background music ----------
// browsers block audio with sound from autoplaying until the user has
// interacted with the page at least once, so it kicks off on the first
// keypress or click rather than immediately on load
const bgMusic = new Audio('music.mp3');
bgMusic.loop = true;
bgMusic.volume = 0.45;
let bgMusicStarted = false;
function startBgMusic() {
  if (bgMusicStarted) return;
  bgMusicStarted = true;
  bgMusic.play().catch(() => {}); // ignore if the browser still blocks it
}
window.addEventListener('keydown', startBgMusic, { once: true });
window.addEventListener('click', startBgMusic, { once: true });
window.addEventListener('touchstart', startBgMusic, { once: true });

// ---------- Ground level ----------
function groundY() {
  return canvas.height - 90;
}

// ---------- Player ----------
const player = {
  x: 150,
  y: 0,
  width: 90,
  height: 82,
  vx: 0,
  vy: 0,
  speed: 5,
  jumpPower: 15,
  gravity: 0.7,
  onGround: false,
  facing: 1 // 1 = right, -1 = left
};
player.y = groundY() - player.height;

// ---------- Load Cherry & Jerry ----------
function loadSprite(filename) {
  const img = new Image();
  const entry = { img: img, loaded: false, trim: { sx: 0, sy: 0, sw: 0, sh: 0 } };
  img.onload = () => {
    // reuse the same trim logic as maham's image
    const off = document.createElement('canvas');
    off.width = img.naturalWidth;
    off.height = img.naturalHeight;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    try {
      const data = octx.getImageData(0, 0, off.width, off.height).data;
      let minX = off.width, minY = off.height, maxX = 0, maxY = 0, found = false;
      for (let y = 0; y < off.height; y++) {
        for (let x = 0; x < off.width; x++) {
          const a = data[(y * off.width + x) * 4 + 3];
          if (a > 10) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      entry.trim = found
        ? { sx: minX, sy: minY, sw: (maxX - minX) + 1, sh: (maxY - minY) + 1 }
        : { sx: 0, sy: 0, sw: img.naturalWidth, sh: img.naturalHeight };
    } catch (e) {
      entry.trim = { sx: 0, sy: 0, sw: img.naturalWidth, sh: img.naturalHeight };
    }
    entry.loaded = true;
  };
  img.onerror = () => {
    document.getElementById('imgNote').textContent =
      "Couldn't load " + filename + " from the pics/ folder — check the file exists there.";
  };
  img.src = 'pics/' + encodeURIComponent(filename).replace(/%2F/g, '/');
  return entry;
}

// ---------- Load Maham's animation frames ----------
// idle when standing still, walk while moving on the ground, jump while
// airborne, attack briefly overrides everything else
const mahamSprites = {
  idle: loadSprite('maham.png'),
  walk: loadSprite('maham walk.png'),
  jump: loadSprite('maham jump.png'),
  attack: loadSprite('maham attack.png')
};
const ATTACK_ANIM_DURATION = 12; // frames of the attack cooldown window that show the attack pose

const cherrySprites = {
  walk: loadSprite('cherry_walk.png'),
  jump: loadSprite('cherry_jump.png')
};
const jerrySprites = {
  walk: loadSprite('jerry_walk.png'),
  jump: loadSprite('jerry_jump.png')
};
const harrisSprite = loadSprite('harris.png');

// full cherry-blossom tree image used for the forest scene's sakura trees
const cherryTreeSprite = loadSprite('cherry.png');
// full pine tree image used for the forest scene's regular trees
const pineTreeSprite = loadSprite('tree.png');
// bush image used for the forest scene's bushes
const bushSprite = loadSprite('bush.png');

// ---------- Junkyard enemies (found by walking off-screen into the junkyard scene) ----------
const enemy1Sprite = loadSprite('enemy 1.png');
const enemy2Sprite = loadSprite('enemy 2.png');
const enemy3Sprite = loadSprite('enemy 3.png');
const enemy1HurtSprite = loadSprite('enemy 1_hurt.png');
const enemy2HurtSprite = loadSprite('enemy 2_hurt.png');
const enemy3HurtSprite = loadSprite('enemy 3_hurt.png');

// the letter the last chud drops once all three are defeated
const letterSprite = loadSprite('letter.png');

// Maham's attack effect
const slashSprite = loadSprite('slash.gif');
// animated GIFs only keep advancing frames while their <img> is actually
// part of the document — keep it attached but visually invisible and
// completely out of the way, so drawImage() picks up its current frame
slashSprite.img.style.position = 'fixed';
slashSprite.img.style.left = '-9999px';
slashSprite.img.style.top = '-9999px';
slashSprite.img.style.width = '2px';
slashSprite.img.style.height = '2px';
slashSprite.img.style.opacity = '0.01';
slashSprite.img.style.pointerEvents = 'none';
document.body.appendChild(slashSprite.img);

// Bakugo's big explosion attack, used in the "choose Harris" boss fight
const explosionSprite = loadSprite('explosion.gif');
explosionSprite.img.style.position = 'fixed';
explosionSprite.img.style.left = '-9999px';
explosionSprite.img.style.top = '-9999px';
explosionSprite.img.style.width = '2px';
explosionSprite.img.style.height = '2px';
explosionSprite.img.style.opacity = '0.01';
explosionSprite.img.style.pointerEvents = 'none';
document.body.appendChild(explosionSprite.img);

// full-screen backdrop for the junkyard scene itself
const junkyardBgSprite = loadSprite('junkyard.gif');

// ---------- Shrine pictures (the secret room) ----------
const mainPicSprite = loadSprite('main.png');
const pic1Sprite = loadSprite('pic.jpg');
const pic2Sprite = loadSprite('pic 2.jpg');

// ---------- Jail cell occupants (also in the secret room) ----------
const char1Sprite = loadSprite('char.png');
const char2Sprite = loadSprite('char 2.png');

// ---------- NPCs (Cherry & Jerry) ----------
const npcWidth = 60, npcHeight = 60;
const npcStartX = 900; // where they're standing, waiting to be found

const cherry = {
  x: npcStartX,
  y: 0,
  width: npcWidth,
  height: npcHeight,
  vx: 0,
  vy: 0,
  speed: 5,
  gravity: 0.7,
  onGround: false,
  facing: -1,
  following: false,
  sprites: cherrySprites,
  followOffset: 55 // stays this far behind its leader
};
cherry.y = groundY() - cherry.height;

const jerry = {
  x: npcStartX + 45,
  y: 0,
  width: npcWidth,
  height: npcHeight,
  vx: 0,
  vy: 0,
  speed: 5,
  gravity: 0.7,
  onGround: false,
  facing: -1,
  following: false,
  sprites: jerrySprites,
  followOffset: 100
};
jerry.y = groundY() - jerry.height;

// ---------- Scenes ----------
// 'forest' -> 'house' (inside) -> 'houseRoom' (the room Harris warns her about)
let currentScene = 'forest';

const HOUSE_WORLD_WIDTH = 1000;

function getRoomWorldWidth() {
  // keep the room at least as wide as the screen so it doesn't scroll,
  // which keeps the shrine (drawn at the room's center) pinned to the
  // true middle of the screen instead of drifting to one side
  return Math.max(canvas.width, 800);
}

// the forest — this is where the house sits; walking off its right edge
// leads to the junkyard, which lives in its own scene (see below)
function getForestBaseWidth() {
  return Math.max(canvas.width * 1.8, 1700);
}

// normally Maham can't walk past the forest's starting edge (x = 0), but
// once Harris is kidnapped, the ground opens up further to the left so she
// can walk over to where he's being held
const PARKOUR_LEFT_EDGE = -2350;
function getForestLeftBound() {
  return harrisKidnapped ? PARKOUR_LEFT_EDGE : 0;
}

// the junkyard is a single static screen (junkyard.gif covers the whole
// canvas), so it never scrolls — its world is exactly one screen wide
function getJunkyardWorldWidth() {
  return canvas.width;
}

function getWorldWidth() {
  if (currentScene === 'house') return HOUSE_WORLD_WIDTH;
  if (currentScene === 'houseRoom') return getRoomWorldWidth();
  if (currentScene === 'junkyard') return getJunkyardWorldWidth();
  return getForestBaseWidth(); // forest
}

// house sitting partway through the forest, with more forest and the junkyard beyond it
let forestHouse = null;
let forestHouseDoor = null;
function setupHouseExterior() {
  const forestWidth = getForestBaseWidth();
  const houseWidth = 260;
  const houseX = forestWidth - 380;
  forestHouse = { x: houseX, width: houseWidth, height: 200 };
  forestHouseDoor = { x: houseX + houseWidth / 2 - 30, width: 60, height: 130 };
}
setupHouseExterior();

// ---------- Junkyard scene (its own full-screen scene, entered by walking off the forest's right edge) ----------
const enemy1 = { x: 0, width: 120, height: 112, facing: -1, sprite: enemy1Sprite, vx: 0, wanderTimer: 0, hurtTimer: 0, hitCount: 0, defeated: false };
const enemy2 = { x: 0, width: 120, height: 112, facing: -1, sprite: enemy2Sprite, vx: 0, wanderTimer: 0, hurtTimer: 0, hitCount: 0, defeated: false };
const enemy3 = { x: 0, width: 120, height: 112, facing: -1, sprite: enemy3Sprite, vx: 0, wanderTimer: 0, hurtTimer: 0, hitCount: 0, defeated: false };
let enemyClusterX = 0;
let enemiesConfronted = false;
const HITS_TO_COLLAPSE = 3;

// letter dropped by the last chud once all three are defeated — falls to
// the ground, sits a moment, then rises into a gentle hover until collected
const letter = {
  x: 0, y: 0, width: 92, height: 120,
  vy: 0,
  state: 'idle', // idle | falling | landed | rising | hovering | collected
  landTimer: 0,
  bobTimer: 0,
  pickupTimer: 0, // counts down after landing before it can be collected
  active: false,
  collected: false
};
let letterDropped = false;

function letterLandY() { return groundY() - letter.height; }
function letterHoverY() { return letterLandY() - 26; }

// positions the chud cluster inside the junkyard scene; called each time the
// scene is entered so it adapts to the current window size
function setupJunkyardScene() {
  const worldWidth = getJunkyardWorldWidth();
  enemyClusterX = worldWidth * 0.62;
  enemy1.x = enemyClusterX - 110;
  enemy2.x = enemyClusterX;
  enemy3.x = enemyClusterX + 110;
  [enemy1, enemy2, enemy3].forEach(en => {
    en.vx = 0;
    en.wanderTimer = 0;
    en.hurtTimer = 0;
    en.hitCount = 0;
    en.defeated = false;
  });
  activeSlashes = [];

  letter.active = false;
  letter.collected = false;
  letter.state = 'idle';
  letter.vy = 0;
  letter.landTimer = 0;
  letter.bobTimer = 0;
  letter.pickupTimer = 0;
  letterDropped = false;
}

// once the dialogue with the chuds ends, they scatter and shuffle around
// slowly instead of just standing there — an easy, non-threatening target
function updateEnemyWander(en) {
  if (en.defeated) return; // stays collapsed on the ground for good

  en.wanderTimer -= 1;
  if (en.wanderTimer <= 0) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    en.vx = dir * (1 + Math.random() * 1.2); // slow shuffle, not too fast
    en.wanderTimer = 50 + Math.random() * 80;
  }
  en.x += en.vx;
  en.facing = en.vx < 0 ? -1 : 1;

  const worldWidth = getJunkyardWorldWidth();
  if (en.x < 0) { en.x = 0; en.vx *= -1; }
  if (en.x + en.width > worldWidth) { en.x = worldWidth - en.width; en.vx *= -1; }

  if (en.hurtTimer > 0) en.hurtTimer -= 1;
}

// ---------- Maham's attack (F key) ----------
const ATTACK_RANGE = 90;
const ATTACK_COOLDOWN = 24;      // frames before she can attack again
const HURT_FLASH_TIME = 30;      // frames an enemy shows its hurt sprite after a non-collapsing hit
const SLASH_VISUAL_DURATION = 20; // frames the slash graphic lingers on whoever was hit
let attackCooldown = 0;
let activeSlashes = []; // { enemy, timer } — each slash sticks to the enemy it hit and tracks their position

function rectsOverlap(a, b) {
  return a.x < b.x + b.width && a.x + a.width > b.x &&
         a.y < b.y + b.height && a.y + a.height > b.y;
}

function tryAttack() {
  if (dialogueActive) return;
  if (attackCooldown > 0) return;

  if (currentScene === 'forest' && bossFightActive && !bossDefeated) {
    attackCooldown = ATTACK_COOLDOWN;
    tryAttackBoss();
    return;
  }

  if (currentScene !== 'junkyard' || !enemiesConfronted) return;
  attackCooldown = ATTACK_COOLDOWN;

  const reachRect = {
    x: player.facing === 1 ? player.x + player.width : player.x - ATTACK_RANGE,
    y: player.y,
    width: ATTACK_RANGE,
    height: player.height
  };

  const gY = groundY();
  [enemy1, enemy2, enemy3].forEach(en => {
    if (en.defeated) return;
    const enRect = { x: en.x, y: gY - en.height, width: en.width, height: en.height };
    if (rectsOverlap(reachRect, enRect)) {
      en.hitCount += 1;
      en.hurtTimer = HURT_FLASH_TIME;
      activeSlashes.push({ enemy: en, timer: SLASH_VISUAL_DURATION });

      if (en.hitCount >= HITS_TO_COLLAPSE) {
        en.defeated = true;
        en.vx = 0;

        // once the last chud standing goes down, the letter falls from the
        // sky into the middle of the junkyard — it lands, then takes a
        // moment before Maham can actually pick it up
        if (!letterDropped && enemy1.defeated && enemy2.defeated && enemy3.defeated) {
          letterDropped = true;
          letter.x = getJunkyardWorldWidth() / 2 - letter.width / 2;
          letter.y = -letter.height - 40; // starts off the top of the screen
          letter.vy = 0;
          letter.state = 'falling';
          letter.active = true;
        }
      } else {
        en.vx = 6 * player.facing; // knocked back away from Maham
        en.wanderTimer = 20; // short stagger before it resumes wandering
      }
    }
  });
}

// Maham's attack, but against Bakugo during the boss fight — he stands
// guard near the captive pole rather than in the junkyard, so this uses
// its own reach check instead of the junkyard one above
function tryAttackBoss() {
  const reachRect = {
    x: player.facing === 1 ? player.x + player.width : player.x - ATTACK_RANGE,
    y: player.y,
    width: ATTACK_RANGE,
    height: player.height
  };

  const platformTop = platformTopY(CAPTIVE_PLATFORM) - bossJumpLift;
  const bossWidth = 90, bossHeight = 120;
  const bossRect = { x: bakugoX, y: platformTop - bossHeight, width: bossWidth, height: bossHeight };

  if (rectsOverlap(reachRect, bossRect)) {
    if (Math.random() < BOSS_PARRY_CHANCE) {
      // he blocks this one outright — no damage, no knockback, just a flash
      // telling Maham it didn't land
      bossParryMsgTimer = BOSS_PARRY_MSG_DURATION;
      return;
    }

    bossHitCount += 1;
    bossHurtTimer = BOSS_HURT_FLASH_TIME;
    bossSlashTimer = SLASH_VISUAL_DURATION;
    bossKnockback = 30 * player.facing; // shoved away from Maham, eases off over the next few frames
    updateBossHealthBar();

    if (bossHitCount >= BOSS_HITS_TO_DEFEAT) {
      bossDefeated = true;
      bossFightActive = false;
      bossAttackState = 'idle';
      blockPromptActive = false;
      blockPromptEl.style.display = 'none';
      bossHealthBarEl.style.display = 'none';
      playerHealthBarEl.style.display = 'none';
      // the slash's countdown normally ticks inside the boss-fight update
      // block, which stops running the instant bossDefeated flips true —
      // clear it here too, or the slash graphic freezes stuck on him forever
      bossSlashTimer = 0;
      bossHurtTimer = 0;
      startDialogue(harrisWonDialogueLines, () => {
        goodEndingPhase = 'walkingToHarris';
      });
    }
  }
}

// snaps them in right behind the player whenever a door is used

  const gY = groundY();

      advanceFinalMessage();

    if (nearDoor === 'forestHouse') enterHouse();
    else if (nearDoor === 'houseExit') exitHouseToForest();

    else if (nearDoor === 'roomExit') exitRoomToHouse();

  }
  if (e.code === 'KeyR' && !e.repeat && blockPromptActive) {
    blockSuccess = true;
    blockPromptActive = false;
    blockPromptEl.style.display = 'none';
  }
});

let trees = [];

const FLOWER_COLORS = ['#ff8fa3', '#ffd93d', '#c589e8', '#ffffff', '#ff9f68'];

function generateScenery() {
  trees = [];
  bushes = [];
  clouds = [];
  hillsFar = [];
  hillsNear = [];
  flowers = [];
  const worldWidth = getForestBaseWidth();
  const leftEdge = PARKOUR_LEFT_EDGE;

  for (let x = leftEdge; x < worldWidth; x += 90 + Math.random() * 120) {
    trees.push({
      x: x,
      scale: 0.7 + Math.random() * 0.8,
      shade: 0.85 + Math.random() * 0.3,
      // most trees are the usual green pines, but every so often one blooms
      // pink instead — a little cherry-blossom variety scattered throughout
      type: Math.random() < 0.28 ? 'sakura' : 'pine'
    });
  }
  for (let x = leftEdge; x < worldWidth; x += 60 + Math.random() * 100) {
    bushes.push({
      x: x,
      scale: 0.6 + Math.random() * 0.6,
      // a bush occasionally gets a few little flower buds dotted on it
      flowered: Math.random() < 0.45,
      flowerColor: FLOWER_COLORS[(Math.random() * FLOWER_COLORS.length) | 0]
    });
  }
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * worldWidth,
      y: 40 + Math.random() * 120,
      scale: 0.7 + Math.random() * 1
    });
  }
  // two soft parallax layers of rolling hills behind the trees, for depth
  for (let x = leftEdge; x < worldWidth; x += 220 + Math.random() * 140) {
    hillsFar.push({ x: x, radius: 160 + Math.random() * 120 });
  }
  for (let x = leftEdge; x < worldWidth; x += 260 + Math.random() * 160) {
    hillsNear.push({ x: x, radius: 130 + Math.random() * 90 });
  }
  // little flower patches scattered along the ground
  for (let x = leftEdge; x < worldWidth; x += 25 + Math.random() * 55) {
    if (Math.random() < 0.55) continue; // keep it sparse, not wall-to-wall
    flowers.push({
      x: x,
      scale: 0.7 + Math.random() * 0.7,
      color: FLOWER_COLORS[(Math.random() * FLOWER_COLORS.length) | 0]
    });
  }
}
generateScenery();

// drifting sakura petals — purely a screen-space weather effect (not tied to
// world position), so they look right no matter where the camera is
const PETAL_COUNT = 16;
function generatePetals() {
  petals = [];
  for (let i = 0; i < PETAL_COUNT; i++) {
    petals.push({
      x: Math.random() * (canvas.width || 800),
      y: Math.random() * (canvas.height || 600),
      vy: 0.5 + Math.random() * 0.7,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.015 + Math.random() * 0.015,
      swayAmount: 18 + Math.random() * 22,
      size: 5 + Math.random() * 4,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      color: Math.random() < 0.5 ? '#ffb6c9' : '#ffd3e0'
    });
  }
}
generatePetals();

function updatePetals() {
  const h = canvas.height, w = canvas.width;
  petals.forEach(p => {
    p.swayPhase += p.swaySpeed;
    p.y += p.vy;
    p.x += Math.sin(p.swayPhase) * 0.6;
    p.rotation += p.rotSpeed;
    if (p.y > h + 10) {
      p.y = -10;
      p.x = Math.random() * w;
    }
  });
}

// 0) purely so drawCaptiveScene/tryAttackBoss/etc. can keep using
// platformTopY() for positioning, which now just resolves to ground level.
const CAPTIVE_PLATFORM = { x: -2260, width: 900, heightAboveGround: 0 };
const CAPTIVES_X = CAPTIVE_PLATFORM.x + CAPTIVE_PLATFORM.width / 2;
bakugoX = CAPTIVES_X + 150; // Bakugo's standing spot, now a mutable position

function platformTopY(p) {
  return groundY() - p.heightAboveGround;
}

// blocks horizontal movement into a mountain's body — you have to jump over/onto it,
// walking into the side just stops you like a wall
function resolvePlatformSides(entity) {
  if (currentScene !== 'forest') return;
  const gY = groundY();
  for (const p of platforms) {
    // only mountain faces (the right-side climbing section) are solid on
    // the sides — everything else (like the ground-level captive spot to
    // the left) shouldn't block horizontal movement.
    if (p.style !== 'mountain') continue;
    const topY = platformTopY(p);
    // only solid where the mountain's rock actually is (below its top surface)
    const verticalOverlap = entity.y + entity.height > topY + 2 && entity.y < gY;
    if (!verticalOverlap) continue;
    const overlapsX = entity.x + entity.width > p.x && entity.x < p.x + p.width;
    if (!overlapsX) continue;

    const penetrationFromLeft = (entity.x + entity.width) - p.x;
    const penetrationFromRight = (p.x + p.width) - entity.x;
    if (penetrationFromLeft < penetrationFromRight) {
      entity.x = p.x - entity.width;
    } else {
      entity.x = p.x + p.width;
    }
  }
}

// shared gravity + collision resolver, used by the player and by the cats
// so everyone can climb the same mountains
function applyGravityAndCollide(entity) {
  const gY = groundY();
  const prevBottom = entity.y + entity.height;

  entity.vy += entity.gravity;
  entity.y += entity.vy;

  let landed = false;

  // ground
  if (entity.y + entity.height >= gY) {
    entity.y = gY - entity.height;
    entity.vy = 0;
    landed = true;
  }

  // platforms — only catch you when falling onto them from above
  if (entity.vy >= 0 && currentScene === 'forest') {
    for (const p of platforms) {
      const topY = platformTopY(p);
      const withinX = entity.x + entity.width > p.x + 6 && entity.x < p.x + p.width - 6;
      if (!withinX) continue;
      const newBottom = entity.y + entity.height;
      if (prevBottom <= topY + 1 && newBottom >= topY) {
        entity.y = topY - entity.height;
        entity.vy = 0;
        landed = true;
        break;
      }
    }
  }

  entity.onGround = landed;
}

// ---------- Camera ----------
let cameraX = 0;

// ---------- Drawing helpers ----------
// deterministic pseudo-random (0-1) from a numeric seed, so each sakura
// tree gets its own consistent branch pattern instead of reshuffling
// every frame
function sakuraRand(seed) {
  const s = Math.sin(seed * 12.9898) * 43758.5453;
  return s - Math.floor(s);
}

// a small clump of overlapping blossom puffs — several of these strung
// along the twig tips read much more like a real cherry tree than one
// big round canopy blob
function drawSakuraBlossomClump(px, py, r, shade, seed) {
  const puffCount = 3;
  for (let i = 0; i < puffCount; i++) {
    const ang = sakuraRand(seed + i * 12.9) * Math.PI * 2;
    const dist = sakuraRand(seed + i * 7.23) * r * 0.5;
    const rr = r * (0.55 + sakuraRand(seed + i * 3.71) * 0.55);
    const cx2 = px + Math.cos(ang) * dist;
    const cy2 = py + Math.sin(ang) * dist * 0.75;
    const g = ctx.createRadialGradient(cx2 - rr * 0.3, cy2 - rr * 0.35, rr * 0.08, cx2, cy2, rr);
    g.addColorStop(0, `rgba(${255*shade|0}, ${212*shade|0}, ${226*shade|0}, 1)`);
    g.addColorStop(0.55, `rgba(${255*shade|0}, ${172*shade|0}, ${197*shade|0}, 1)`);
    g.addColorStop(1, `rgba(${222*shade|0}, ${122*shade|0}, ${158*shade|0}, 1)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx2, cy2, rr, 0, Math.PI * 2);
    ctx.fill();
  }
  // an occasional darker accent puff so the clumps aren't perfectly flat
  if (sakuraRand(seed + 50) > 0.45) {
    ctx.fillStyle = `rgba(${210*shade|0}, ${112*shade|0}, ${146*shade|0}, 0.55)`;
    ctx.beginPath();
    ctx.arc(px + r * 0.15, py + r * 0.22, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
  }
}

// recursively branches upward and outward from (x,y), thinning and
// shortening each generation, with a blossom clump hung on every twig
// tip — this is what gives the canopy real structure instead of a blob
function drawSakuraBranch(x, y, angle, length, width, depth, scale, shade, seed) {
  const wobble = (sakuraRand(seed + 1) - 0.5) * 0.5;
  const bentAngle = angle + wobble;
  const midX = x + Math.cos(angle) * length * 0.5;
  const midY = y + Math.sin(angle) * length * 0.5;
  const endX = x + Math.cos(bentAngle) * length;
  const endY = y + Math.sin(bentAngle) * length;

  ctx.strokeStyle = `rgb(${62*shade|0}, ${42*shade|0}, ${22*shade|0})`;
  ctx.lineWidth = Math.max(1, width);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(midX, midY, endX, endY);
  ctx.stroke();

  if (depth <= 0) {
    drawSakuraBlossomClump(endX, endY, 10 * scale, shade, seed * 2.13 + 7);
    return;
  }

  for (let i = 0; i < 2; i++) {
    const dir = i === 0 ? -1 : 1;
    const spread = 0.5 + sakuraRand(seed + i * 4.4) * 0.35;
    const childSeed = seed * 1.37 + i * 17.3 + 5;
    const childAngle = bentAngle + dir * spread;
    const childLen = length * (0.66 + sakuraRand(childSeed) * 0.14);
    drawSakuraBranch(endX, endY, childAngle, childLen, width * 0.68, depth - 1, scale, shade, childSeed);
  }
}

// a small pointed leaf, used to tuck real foliage in among the sakura
// blossoms so the canopy doesn't read as pure pink fluff
function drawSakuraLeaf(x, y, size, angle, shade) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const leafGrad = ctx.createLinearGradient(-size * 0.2, 0, size, 0);
  leafGrad.addColorStop(0, `rgb(${46*shade|0}, ${118*shade|0}, ${58*shade|0})`);
  leafGrad.addColorStop(1, `rgb(${86*shade|0}, ${168*shade|0}, ${86*shade|0})`);
  ctx.fillStyle = leafGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(size * 0.35, -size * 0.4, size, 0);
  ctx.quadraticCurveTo(size * 0.35, size * 0.4, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `rgba(${28*shade|0}, ${70*shade|0}, ${34*shade|0}, 0.65)`;
  ctx.lineWidth = Math.max(0.6, size * 0.09);
  ctx.beginPath();
  ctx.moveTo(size * 0.08, 0);
  ctx.lineTo(size * 0.92, 0);
  ctx.stroke();
  ctx.restore();
}

// cherry.png is a full tree image (trunk + blossoms), drawn feet-down at
// the tree's ground position. If it hasn't loaded (e.g. missing from the
// pics folder), we fall back to the old procedural branch-and-blossom
// tree so the scene doesn't show a blank gap.
function drawSakuraTree(x, groundYpos, scale, shade) {
  const gx = x - cameraX;

  if (cherryTreeSprite.loaded) {
    const t = cherryTreeSprite.trim;
    const targetH = 200 * scale;
    const fitScale = targetH / t.sh;
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.save();
    ctx.filter = `brightness(${shade})`;
    ctx.drawImage(
      cherryTreeSprite.img,
      t.sx, t.sy, t.sw, t.sh,
      gx - drawW / 2, groundYpos - drawH, drawW, drawH
    );
    ctx.restore();
    return;
  }

  // ---- fallback: procedural branch-and-blossom tree ----
  const trunkW = 18 * scale;
  const trunkH = 70 * scale;
  const trunkGrad = ctx.createLinearGradient(gx - trunkW/2, 0, gx + trunkW/2, 0);
  trunkGrad.addColorStop(0, `rgb(${68*shade|0}, ${44*shade|0}, ${20*shade|0})`);
  trunkGrad.addColorStop(0.55, `rgb(${101*shade|0}, ${67*shade|0}, ${33*shade|0})`);
  trunkGrad.addColorStop(1, `rgb(${138*shade|0}, ${94*shade|0}, ${48*shade|0})`);
  ctx.fillStyle = trunkGrad;
  ctx.fillRect(gx - trunkW/2, groundYpos - trunkH, trunkW, trunkH);

  const topX = gx, topY = groundYpos - trunkH;
  const seedBase = x * 0.137 + 11;
  const mainAngles = [-1.5708 - 0.95, -1.5708 - 0.32, -1.5708 + 0.32, -1.5708 + 0.95];

  mainAngles.forEach((ang, i) => {
    const seed = seedBase + i * 31.7;
    const lenVar = 0.85 + sakuraRand(seed) * 0.3;
    drawSakuraBranch(topX, topY, ang, 34 * scale * lenVar, 5 * scale, 3, scale, shade, seed * 10);
  });

  drawSakuraLeaf(topX - 14 * scale, topY - 6 * scale, 10 * scale, -0.6, shade);
  drawSakuraLeaf(topX + 12 * scale, topY - 10 * scale, 9 * scale, 0.5, shade);
}

// tree.png is a full pine tree image (trunk + foliage), drawn feet-down
// at the tree's ground position. Falls back to the old procedural cone
// tree if it hasn't loaded yet.
function drawPineTree(x, groundYpos, scale, shade) {
  const gx = x - cameraX;

  if (pineTreeSprite.loaded) {
    const t = pineTreeSprite.trim;
    const targetH = 200 * scale;
    const fitScale = targetH / t.sh;
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.save();
    ctx.filter = `brightness(${shade})`;
    ctx.drawImage(
      pineTreeSprite.img,
      t.sx, t.sy, t.sw, t.sh,
      gx - drawW / 2, groundYpos - drawH, drawW, drawH
    );
    ctx.restore();
    return;
  }

  // ---- fallback: procedural cone tree ----
  const trunkW = 18 * scale;
  const trunkH = 70 * scale;
  const trunkGrad = ctx.createLinearGradient(gx - trunkW/2, 0, gx + trunkW/2, 0);
  trunkGrad.addColorStop(0, `rgb(${68*shade|0}, ${44*shade|0}, ${20*shade|0})`);
  trunkGrad.addColorStop(0.55, `rgb(${101*shade|0}, ${67*shade|0}, ${33*shade|0})`);
  trunkGrad.addColorStop(1, `rgb(${138*shade|0}, ${94*shade|0}, ${48*shade|0})`);
  ctx.fillStyle = trunkGrad;
  ctx.fillRect(gx - trunkW/2, groundYpos - trunkH, trunkW, trunkH);

  const foliageLevels = [
    { yOff: trunkH * 1.0, r: 55 * scale },
    { yOff: trunkH * 1.35, r: 45 * scale },
    { yOff: trunkH * 1.65, r: 34 * scale }
  ];
  foliageLevels.forEach(lvl => {
    const baseY = groundYpos - lvl.yOff + 20;
    const topY = groundYpos - lvl.yOff - lvl.r;
    const foliageGrad = ctx.createLinearGradient(gx - lvl.r, baseY, gx + lvl.r * 0.6, topY);
    foliageGrad.addColorStop(0, `rgb(${22*shade|0}, ${78*shade|0}, ${36*shade|0})`);
    foliageGrad.addColorStop(0.55, `rgb(${34*shade|0}, ${110*shade|0}, ${50*shade|0})`);
    foliageGrad.addColorStop(1, `rgb(${62*shade|0}, ${152*shade|0}, ${76*shade|0})`);
    ctx.fillStyle = foliageGrad;
    ctx.beginPath();
    ctx.moveTo(gx - lvl.r, baseY);
    ctx.lineTo(gx + lvl.r, baseY);
    ctx.lineTo(gx, topY);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = `rgba(${140*shade|0}, ${200*shade|0}, ${130*shade|0}, 0.35)`;
    ctx.lineWidth = 1.5 * scale;
    ctx.beginPath();
    ctx.moveTo(gx, topY);
    ctx.lineTo(gx + lvl.r * 0.55, baseY - lvl.r * 0.1);
    ctx.stroke();
  });
}

function drawTree(x, groundYpos, scale, shade, type) {
  const gx = x - cameraX;

  // soft contact shadow to ground the tree
  ctx.fillStyle = 'rgba(20,30,15,0.18)';
  ctx.beginPath();
  ctx.ellipse(gx, groundYpos + 3, 32 * scale, 10 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  if (type === 'sakura') {
    drawSakuraTree(x, groundYpos, scale, shade);
  } else {
    drawPineTree(x, groundYpos, scale, shade);
  }
}

function drawBush(x, groundYpos, scale, flowered, flowerColor) {
  const gx = x - cameraX;

  ctx.fillStyle = 'rgba(20,30,15,0.16)';
  ctx.beginPath();
  ctx.ellipse(gx, groundYpos + 2, 26 * scale, 7 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  let topY; // y-position of the bush's crown, used to place flower dots

  if (bushSprite.loaded) {
    const t = bushSprite.trim;
    const targetH = 60 * scale;
    const fitScale = targetH / t.sh;
    const drawW = t.sw * fitScale;
    const drawH = t.sh * fitScale;
    ctx.drawImage(
      bushSprite.img,
      t.sx, t.sy, t.sw, t.sh,
      gx - drawW / 2, groundYpos - drawH, drawW, drawH
    );
    topY = groundYpos - drawH;
  } else {
    // ---- fallback: procedural triple-lobe bush ----
    for (let i = 0; i < 3; i++) {
      const lx = gx + i * 14 * scale - 14*scale;
      const ly = groundYpos - 12*scale;
      const lr = 16*scale;
      const lobeGrad = ctx.createRadialGradient(lx - lr*0.3, ly - lr*0.35, lr*0.1, lx, ly, lr);
      lobeGrad.addColorStop(0, '#4fa15c');
      lobeGrad.addColorStop(0.65, '#2f7d3c');
      lobeGrad.addColorStop(1, '#255f2f');
      ctx.fillStyle = lobeGrad;
      ctx.beginPath();
      ctx.arc(lx, ly, lr, 0, Math.PI * 2);
      ctx.fill();
    }
    topY = groundYpos - 28 * scale;
  }

  if (flowered) {
    ctx.fillStyle = flowerColor || '#ff8fa3';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(gx + (i - 1) * 14 * scale, topY + 8 * scale, 3.2 * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// soft rolling hill silhouettes behind the trees, for a bit of depth —
// drawn with a gentle parallax factor so they crawl by slower than the
// foreground as the camera scrolls
function drawHillLayer(hills, parallax, color) {
  const gY = groundY();
  const camOffset = cameraX * parallax;
  ctx.fillStyle = color;
  hills.forEach(h => {
    const gx = h.x - camOffset;
    if (gx + h.radius < -20 || gx - h.radius > canvas.width + 20) return;
    ctx.beginPath();
    ctx.arc(gx, gY + h.radius * 0.55, h.radius, Math.PI, 0);
    ctx.fill();
  });
}

// a soft, low sun sitting in the sky — fixed in screen space so it always
// reads as "far away", with a gentle glow instead of a hard disc
function drawSunGlow() {
  const sx = canvas.width * 0.78;
  const sy = canvas.height * 0.18;
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 230);
  glow.addColorStop(0, 'rgba(255,244,214,0.85)');
  glow.addColorStop(0.4, 'rgba(255,224,180,0.35)');
  glow.addColorStop(1, 'rgba(255,224,180,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sx - 230, sy - 230, 460, 460);
  ctx.fillStyle = '#fff8e8';
  const sunR = 46;
  ctx.beginPath();
  ctx.arc(sx, sy, sunR, 0, Math.PI * 2);
  ctx.fill();

  // a quiet little easter egg: main.png sits faintly inside the sun disc,
  // clipped to a circle and drawn at low opacity so it only really reads
  // if you're looking closely rather than jumping out at a glance
  if (mainPicSprite.loaded) {
    const t = mainPicSprite.trim;
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, sunR, 0, Math.PI * 2);
    ctx.clip();
    const coverScale = Math.max((sunR * 2) / t.sw, (sunR * 2) / t.sh);
    const drawW = t.sw * coverScale;
    const drawH = t.sh * coverScale;
    ctx.globalAlpha = 0.16;
    ctx.drawImage(
      mainPicSprite.img,
      t.sx, t.sy, t.sw, t.sh,
      sx - drawW / 2, sy - drawH / 2, drawW, drawH
    );
    ctx.restore();
  }
}

// a small five-petal flower with a bright little center, planted right on
// the grass line
function drawFlower(x, groundYpos, scale, color) {
  const gx = x - cameraX;
  const stemH = 10 * scale;
  ctx.strokeStyle = '#3f7a34';
  ctx.lineWidth = 1.5 * scale;
  ctx.beginPath();
  ctx.moveTo(gx, groundYpos);
  ctx.lineTo(gx, groundYpos - stemH);
  ctx.stroke();

  const cy = groundYpos - stemH - 3 * scale;
  const petalR = 3.4 * scale;
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {
    const ang = (Math.PI * 2 / 5) * i;
    ctx.beginPath();
    ctx.arc(gx + Math.cos(ang) * petalR, cy + Math.sin(ang) * petalR, petalR * 0.95, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath();
  ctx.arc(gx, cy, petalR * 0.6, 0, Math.PI * 2);
  ctx.fill();
}

// gently tumbling petal, drawn in pure screen space (see updatePetals)
function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCloud(x, y, scale) {
  const gx = x - cameraX * 0.3; // parallax
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(gx, y, 22*scale, 0, Math.PI*2);
  ctx.arc(gx + 24*scale, y - 8*scale, 26*scale, 0, Math.PI*2);
  ctx.arc(gx + 50*scale, y, 20*scale, 0, Math.PI*2);
  ctx.fill();
}

function drawGround() {
  const gY = groundY();
  const grad = ctx.createLinearGradient(0, gY, 0, canvas.height);
  grad.addColorStop(0, '#5aa347');
  grad.addColorStop(0.12, '#4a8c3a');
  grad.addColorStop(1, '#356629');
  ctx.fillStyle = grad;
  ctx.fillRect(0, gY, canvas.width, canvas.height - gY);
  ctx.fillStyle = '#3a6e2c';
  ctx.fillRect(0, gY, canvas.width, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(0, gY, canvas.width, 2);

  ctx.strokeStyle = '#2f5c22';
  ctx.lineWidth = 2;
  for (let x = -((cameraX*0.8) % 30); x < canvas.width; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, gY);
    ctx.lineTo(x - 4, gY - 10);
    ctx.moveTo(x, gY);
    ctx.lineTo(x + 4, gY - 10);
    ctx.stroke();
  }
}

function drawJunkyardBackground() {
  if (junkyardBgSprite.loaded) {
    ctx.drawImage(junkyardBgSprite.img, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#4a463f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2f2c27';
    ctx.fillRect(0, groundY(), canvas.width, canvas.height - groundY());
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('junkyard.gif', canvas.width / 2, canvas.height / 2);
  }
}

// Maham's attack slash — sticks to whichever enemy got hit and follows
// their body (including any knockback) for the rest of its short life
function drawSlashes() {
  const gY = groundY();
  activeSlashes.forEach(s => {
    if (s.timer <= 0) return;
    const en = s.enemy;
    const gx = en.x - cameraX;
    const size = Math.max(en.width, en.height) * 1.15;
    const cx = gx + en.width / 2;
    const cy = gY - en.height / 2;

    ctx.save();
    ctx.translate(cx, cy);
    if (en.facing === -1) ctx.scale(-1, 1);
    if (slashSprite.loaded) {
      const t = slashSprite.trim;
      const fitScale = Math.min(size / t.sw, size / t.sh);
      const drawW = t.sw * fitScale;
      const drawH = t.sh * fitScale;
      ctx.drawImage(
        slashSprite.img,
        t.sx, t.sy, t.sw, t.sh,
        -drawW / 2, -drawH / 2, drawW, drawH
      );
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(-size / 2, -size / 2, size, size);
    }
    ctx.restore();
  });
}


function drawDoor(x, width, height) {
  const gx = x - cameraX;
  const gy = groundY() - height;
  ctx.fillStyle = '#5c3a21';
  ctx.fillRect(gx, gy, width, height);
  ctx.strokeStyle = '#3a2414';
  ctx.lineWidth = 3;
  ctx.strokeRect(gx, gy, width, height);
  // wood panel lines
  ctx.strokeStyle = 'rgba(0,0,0,0.2)';
  ctx.lineWidth = 2;
  ctx.strokeRect(gx + 8, gy + 10, width - 16, height * 0.4);
  ctx.strokeRect(gx + 8, gy + height * 0.52, width - 16, height * 0.4);
  ctx.fillStyle = '#f4d35e';
  ctx.beginPath();
  ctx.arc(gx + width - 10, gy + height / 2, 4, 0, Math.PI * 2);
  ctx.fill();
}

function drawHouseExterior() {
  if (!forestHouse) return;
  const gY = groundY();
  const gx = forestHouse.x - cameraX;
  const w = forestHouse.width, h = forestHouse.height;
  const roofPeakY = gY - h - 90;

  // stone path leading up to the door
  ctx.fillStyle = '#a9a196';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.ellipse(gx - 40 - i * 38, gY - 3, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // walls with a subtle wood-plank shade
  ctx.fillStyle = '#d9a066';
  ctx.fillRect(gx, gY - h, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  for (let px = gx + 20; px < gx + w; px += 26) {
    ctx.beginPath();
    ctx.moveTo(px, gY - h);
    ctx.lineTo(px, gY);
    ctx.stroke();
  }
  // corner trim posts
  ctx.fillStyle = '#b9804a';
  ctx.fillRect(gx, gY - h, 10, h);
  ctx.fillRect(gx + w - 10, gY - h, 10, h);

  // roof
  ctx.fillStyle = '#8b3a2a';
  ctx.beginPath();
  ctx.moveTo(gx - 25, gY - h + 6);
  ctx.lineTo(gx + w / 2, roofPeakY);
  ctx.lineTo(gx + w + 25, gY - h + 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#5e2419';
  ctx.lineWidth = 2;
  for (let i = 1; i <= 4; i++) {
    const t = i / 5;
    ctx.beginPath();
    ctx.moveTo(gx - 25 + (w / 2 + 25) * t, gY - h + 6 - (gY - h + 6 - roofPeakY) * t);
    ctx.lineTo(gx - 25 + (w / 2 + 25) * t + 14, gY - h + 6 - (gY - h + 6 - roofPeakY) * t + 3);
    ctx.stroke();
  }

  // chimney with drifting smoke
  const chimX = gx + w * 0.28;
  const chimTopY = roofPeakY + 55;
  ctx.fillStyle = '#7d6355';
  ctx.fillRect(chimX, chimTopY, 26, gY - h - chimTopY + 10);
  ctx.fillStyle = '#5e4a3f';
  ctx.fillRect(chimX - 4, chimTopY - 6, 34, 10);
  const smokeT = (Date.now() / 900) % 1;
  for (let i = 0; i < 3; i++) {
    const st = (smokeT + i / 3) % 1;
    ctx.fillStyle = `rgba(255,255,255,${0.5 - st * 0.4})`;
    ctx.beginPath();
    ctx.arc(chimX + 13 + Math.sin(st * 6) * 8, chimTopY - 10 - st * 60, 6 + st * 10, 0, Math.PI * 2);
    ctx.fill();
  }

  // window with flower box
  const winX = gx + w - 75, winY = gY - h + 40;
  ctx.fillStyle = '#bfe9ff';
  ctx.fillRect(winX, winY, 40, 40);
  ctx.strokeStyle = '#5c3a21';
  ctx.lineWidth = 3;
  ctx.strokeRect(winX, winY, 40, 40);
  ctx.beginPath();
  ctx.moveTo(winX + 20, winY); ctx.lineTo(winX + 20, winY + 40);
  ctx.moveTo(winX, winY + 20); ctx.lineTo(winX + 40, winY + 20);
  ctx.stroke();
  ctx.fillStyle = '#6b4226';
  ctx.fillRect(winX - 4, winY + 40, 48, 8);
  const flowerColors = ['#e63946', '#f4a261', '#ffdd57', '#e63946'];
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = flowerColors[i];
    ctx.beginPath();
    ctx.arc(winX + 4 + i * 11, winY + 40, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // second small window on the left of the door
  const win2X = gx + 30, win2Y = gY - h + 45;
  ctx.fillStyle = '#bfe9ff';
  ctx.fillRect(win2X, win2Y, 34, 34);
  ctx.strokeStyle = '#5c3a21';
  ctx.strokeRect(win2X, win2Y, 34, 34);
  ctx.beginPath();
  ctx.moveTo(win2X + 17, win2Y); ctx.lineTo(win2X + 17, win2Y + 34);
  ctx.moveTo(win2X, win2Y + 17); ctx.lineTo(win2X + 34, win2Y + 17);
  ctx.stroke();

  // flower beds along the base of the house
  const bedColors = ['#e63946', '#ffdd57', '#4a6fa5', '#e63946', '#f4a261'];
  ctx.fillStyle = '#3a6e2c';
  ctx.fillRect(gx - 15, gY - 6, w + 30, 8);
  for (let i = 0; i < 9; i++) {
    ctx.fillStyle = bedColors[i % bedColors.length];
    ctx.beginPath();
    ctx.arc(gx - 10 + i * (w + 20) / 8, gY - 8, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // small porch step in front of the door
  ctx.fillStyle = '#8a8578';
  ctx.fillRect(forestHouseDoor.x - 8, gY - 8, forestHouseDoor.width + 16, 8);

  drawDoor(forestHouseDoor.x, forestHouseDoor.width, forestHouseDoor.height);
}

function drawIndoorBackground(wallColor, floorColor, trimColor) {
  const gY = groundY();
  ctx.fillStyle = wallColor;
  ctx.fillRect(0, 0, canvas.width, gY);

  // wainscoting: a darker lower band of wall
  ctx.fillStyle = trimColor;
  ctx.globalAlpha = 0.18;
  ctx.fillRect(0, gY - 70, canvas.width, 70);
  ctx.globalAlpha = 1;

  // simple wood-plank wall texture, scrolls with the camera
  ctx.strokeStyle = trimColor;
  ctx.lineWidth = 1;
  for (let x = -((cameraX) % 60); x < canvas.width; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, gY);
    ctx.stroke();
  }

  ctx.fillStyle = floorColor;
  ctx.fillRect(0, gY, canvas.width, canvas.height - gY);
  // floorboard seams
  ctx.strokeStyle = trimColor;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  for (let x = -((cameraX) % 45); x < canvas.width; x += 45) {
    ctx.beginPath();
    ctx.moveTo(x, gY + 6);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = trimColor;
  ctx.fillRect(0, gY, canvas.width, 8);
}

function drawRug(cx) {

  const gx = cx - cameraX;
  ctx.fillStyle = '#b5533c';
  ctx.beginPath();
  ctx.ellipse(gx, gY - 3, 95, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#8a3d2b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.ellipse(gx, gY - 3, 72, 10, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#e0a458';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(gx, gY - 3, 50, 6, 0, 0, Math.PI * 2);
  ctx.stroke();
}

function drawFireplace(x) {
  const gY = groundY();
  const gx = x - cameraX;
  const w = 100, h = 150;
  // stone surround
  ctx.fillStyle = '#8c8c8c';
  ctx.fillRect(gx, gY - h, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 3; c++) {
      ctx.fillRect(gx + 6 + c * 32 + (r % 2 ? 10 : 0), gY - h + 6 + r * 28, 24, 20);
    }
  }
  // firebox
  ctx.fillStyle = '#241f1c';
  ctx.fillRect(gx + 18, gY - 78, w - 36, 78);
  // fire
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath();
  ctx.moveTo(gx + w / 2 - 16, gY - 4);
  ctx.quadraticCurveTo(gx + w / 2 - 20, gY - 40, gx + w / 2, gY - 55);
  ctx.quadraticCurveTo(gx + w / 2 + 20, gY - 40, gx + w / 2 + 16, gY - 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.moveTo(gx + w / 2 - 8, gY - 4);
  ctx.quadraticCurveTo(gx + w / 2, gY - 32, gx + w / 2 + 8, gY - 4);
  ctx.closePath();
  ctx.fill();
  // mantel
  ctx.fillStyle = '#5c3a21';
  ctx.fillRect(gx - 12, gY - h - 14, w + 24, 16);
}

function drawBookshelf(x) {

    ctx.fillStyle = '#3a2414';

  }
}
